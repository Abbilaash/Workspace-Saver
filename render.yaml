services:
  - type: web
    name: workspace-saver
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_DATABASE
        value: workspace_saver
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false
